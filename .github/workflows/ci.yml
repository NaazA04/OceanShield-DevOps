name: OceanShield CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Docker image
        run: docker build -t oceanshield-api .

      - name: Run Docker container
        run: docker run -d -p 8000:8000 --name oceanshield-test oceanshield-api

      - name: Health check
        run: |
          sleep 5
          curl --fail http://localhost:8000/health

      - name: Stop Docker container
        if: always()
        run: docker stop oceanshield-test
